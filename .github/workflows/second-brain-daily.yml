name: Second Brain Daily Rollup

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        shell: bash
        env:
          CORE_URL: ${{ secrets.UTCOS_AGENT_CORE_URL }}
          CORE_KEY: ${{ secrets.UTCOS_AGENT_CORE_KEY }}
        run: |
          if [ -z "$CORE_URL" ] || [ -z "$CORE_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "UTC.OS Agent Core deployment secrets are not configured; exiting safely."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run daily rollup
        if: steps.cfg.outputs.configured == 'true'
        shell: bash
        env:
          CORE_URL: ${{ secrets.UTCOS_AGENT_CORE_URL }}
          CORE_KEY: ${{ secrets.UTCOS_AGENT_CORE_KEY }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST "$CORE_URL/v1/rollup/daily" \
            -H "Authorization: Bearer $CORE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

name: Agent Core Live Check

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live deployment
        shell: bash
        env:
          CORE_URL: ${{ secrets.UTCOS_AGENT_CORE_URL }}
          CORE_KEY: ${{ secrets.UTCOS_AGENT_CORE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CORE_URL:-}" ] || [ -z "${CORE_KEY:-}" ]; then
            echo "::error::Agent Core live verification cannot run: CORE_URL or CORE_KEY is missing."
            exit 1
          fi

          CORE_URL="${CORE_URL%/}"
          curl --fail-with-body --retry 3 --retry-delay 5 "$CORE_URL/ready"
          curl --fail-with-body --retry 3 --retry-delay 5 "$CORE_URL/v1/agents"             -H "Authorization: Bearer $CORE_KEY"             -H "Accept: application/json"

          STATUS=$(curl --fail-with-body --retry 3 --retry-delay 5 "$CORE_URL/v1/status" \
            -H "Authorization: Bearer $CORE_KEY" -H "Accept: application/json")
          node -e 'const x=JSON.parse(process.argv[1]);if(!x.database||!x.llm||!x.personaProfiles?.allLoaded)process.exit(1)' "$STATUS"

          echo "Agent Core live deployment verified."

name: Refresh UTC.OS Job Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: utc-os-job-radar
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh verified public opportunity feed
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node scripts/job-radar.mjs
      - name: Commit changed feed
        run: |
          if git diff --quiet -- data/job-radar.json; then
            echo "No radar changes."
            exit 0
          fi
          git config user.name "utc-os-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job-radar.json
          git commit -m "Refresh Pittsburgh Job Radar"
          git push

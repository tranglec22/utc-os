name: Mothership UI CI

on:
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - "sw.js"
      - "data/job-radar.json"
      - ".github/workflows/mothership-ui.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check sw.js
          node --check assets/player.js
      - name: Check data feeds are valid JSON
        run: |
          node -e 'for (const f of ["data/job-radar.json","data/second-brain-public.json","manifest.json"]) JSON.parse(require("fs").readFileSync(f,"utf8"))'
      - name: Verify command dock IDs
        shell: bash
        run: |
          grep -q 'id="mothershipDock"' index.html
          grep -q 'id="dockInput"' index.html
          grep -q 'id="dockAgents"' index.html
          grep -q 'function autoRouteAgent' assets/app.js
          grep -q 'name: "Bastion"' assets/app.js
          grep -q 'function syncDockReply' assets/app.js
          grep -q 'function leadExpired' assets/app.js

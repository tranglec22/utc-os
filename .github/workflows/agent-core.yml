name: Agent Core CI

on:
  pull_request:
    paths:
      - "server/**"
      - "assets/app.js"
      - "index.html"
      - "sw.js"
      - "render.yaml"
      - ".github/workflows/agent-core.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: utcos
          POSTGRES_PASSWORD: utcos-test
          POSTGRES_DB: utcos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utcos -d utcos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://utcos:utcos-test@localhost:5432/utcos
      PGSSL: disable
      UTCOS_AGENT_CORE_KEY: ci-agent-core-key
      UTCOS_VAULT_KEY: ci-vault-key-123456789012345678901234
      UTCOS_BACKUP_KEY: ci-backup-key-12345678901234567890123
      UTCOS_LLM_BASE_URL: http://127.0.0.1:9090/v1
      UTCOS_LLM_API_KEY: ci-llm-key
      UTCOS_LLM_MODEL: ci-model
      UTCOS_ALLOW_PRIVATE_LLM_CONTEXT: "true"
      PORT: "8787"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install --package-lock=false
      - run: npm run check
      - name: Check Mothership browser JavaScript
        working-directory: .
        run: node --check assets/app.js
      - run: npm run db:init
      - name: Validate Render Blueprint YAML
        working-directory: .
        run: ruby -e "require 'yaml'; YAML.load_file('render.yaml'); puts 'render.yaml valid'"
      - name: REST + encrypted vault smoke test
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const http=require("http");http.createServer((req,res)=>{let b="";req.on("data",d=>b+=d);req.on("end",()=>{res.writeHead(200,{"content-type":"application/json"});res.end(JSON.stringify({model:"ci-model",choices:[{message:{content:"Agent runtime alive."}}]}));});}).listen(9090)' >/tmp/utcos-fake-llm.log 2>&1 &
          FAKE_PID=$!
          npm start >/tmp/utcos-agent-core.log 2>&1 &
          PID=$!
          trap 'kill "$PID" "$FAKE_PID" || true; cat /tmp/utcos-agent-core.log || true; cat /tmp/utcos-fake-llm.log || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8787/ready >/dev/null && break
            sleep 1
          done
          HEADERS=$(mktemp)
          curl -fsS -D "$HEADERS" http://127.0.0.1:8787/v1/agents \
            -H "Origin: https://tranglec22.github.io" \
            -H "Authorization: Bearer $UTCOS_AGENT_CORE_KEY" >/dev/null
          grep -qi "access-control-allow-origin: https://tranglec22.github.io" "$HEADERS"
          STATUS=$(curl -fsS http://127.0.0.1:8787/v1/status \
            -H "Authorization: Bearer $UTCOS_AGENT_CORE_KEY")
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.llm||!x.database||!x.vault) process.exit(1)' "$STATUS"
          AGENT=$(curl -fsS -X POST http://127.0.0.1:8787/v1/agent/respond \
            -H "Authorization: Bearer $UTCOS_AGENT_CORE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"agentId":"kara","message":"Plan the next move","workspace":"All work","history":[]}')
          node -e 'const x=JSON.parse(process.argv[1]); if(x.reply!=="Agent runtime alive."||x.agent.id!=="kara") process.exit(1)' "$AGENT"
          BODY=$(curl -fsS -X POST http://127.0.0.1:8787/v1/vault             -H "Authorization: Bearer $UTCOS_AGENT_CORE_KEY"             -H "Content-Type: application/json"             -d '{"title":"CI vault item","plaintext":"ci-secret-value","workspace":"UTC.OS"}')
          ID=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.entry.id)' "$BODY")
          curl -fsS http://127.0.0.1:8787/v1/vault             -H "Authorization: Bearer $UTCOS_AGENT_CORE_KEY" | grep -q "CI vault item"
          READ=$(curl -fsS "http://127.0.0.1:8787/v1/vault/$ID"             -H "Authorization: Bearer $UTCOS_AGENT_CORE_KEY")
          node -e 'const x=JSON.parse(process.argv[1]); if(x.entry.plaintext!=="ci-secret-value") process.exit(1)' "$READ"
      - name: Encrypted backup round-trip smoke test
        shell: bash
        run: |
          set -euo pipefail
          export UTCOS_BACKUP_PATH=/tmp/utcos-ci.backup.enc.json
          npm run backup
          test -s "$UTCOS_BACKUP_PATH"
          if grep -q "ci-secret-value" "$UTCOS_BACKUP_PATH"; then
            echo "plaintext leaked into encrypted backup"
            exit 1
          fi
          npm run backup:inspect -- "$UTCOS_BACKUP_PATH" | grep -q '"valid": true'
      - name: Docker build
        working-directory: .
        run: docker build -f server/Dockerfile -t utcos-agent-core:ci server
